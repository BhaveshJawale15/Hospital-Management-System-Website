<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CityCare Hospital</title>
    <link rel="stylesheet" href="forgot-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="status-msg" style="display: none;" id="resetMsg">
        Reset link sent to your email!
    </div>

    <div class="register-wrapper">
        <div class="side-banner"> 
            <img src="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" 
                alt="Hospital Corridors" class="banner-img"> 
            <div class="banner-overlay"></div>
            <div class="banner-content"> 
                <i class="fas fa-hospital-user main-icon"></i> 
                <h1>Account Recovery</h1> 
                <p>Don't worry, it happens to the best of us. Let's get you back into your health dashboard.</p> 
            </div> 
        </div>

        <div class="form-section">
            <div class="form-container">
                <h2>Forgot Password?</h2>
                <p class="subtitle">Enter the email address associated with your account.</p>

                <form class="auth-form">
                    <div class="input-group">
                        <label>Email Address</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" placeholder="you@example.com" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-confirm full-width">Send Reset Link</button>
                    
                    <div class="auth-footer">
                        <p>Remember your password? <a href="login.html">Log In</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
