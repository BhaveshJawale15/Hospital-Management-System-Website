<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Create Account | CityCare Hospital</title> 
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body> 

<div class="login-wrapper"> 

    <div class="side-banner"> 
        <img src="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" 
             alt="Hospital Corridors" class="banner-img"> 
        <div class="banner-overlay"></div>
        <div class="banner-content"> 
            <i class="fas fa-hospital-user main-icon"></i> 
            <h1>Join CityCare</h1> 
            <p>Start your journey towards better health management today.</p> 
        </div> 
    </div> 
    
    <div class="form-section"> 
        <div id="status-message" class="status-msg hidden">Account Created. Now log in.</div>
        <div class="form-container"> 

            <div class="header-text"> 
                <h2>Create Account</h2> 
                <p>Enter your details to register as a new patient.</p> 
            </div> 

            <form id="register-form" class="login-form"> 
                <div class="input-group"> 
                    <label for="fullname">Full Name</label> 
                    <div class="input-wrapper"> 
                        <i class="fas fa-user"></i> 
                        <input type="text" id="fullname" placeholder="John Doe" required> 
                    </div> 
                </div> 

                <div class="input-group"> 
                    <label for="email">Email Address</label> 
                    <div class="input-wrapper"> 
                        <i class="fas fa-envelope"></i> 
                        <input type="email" id="email" placeholder="you@example.com" required> 
                    </div> 
                </div> 

                <div class="input-group"> 
                    <label for="phone">Phone Number</label> 
                    <div class="input-wrapper"> 
                        <i class="fas fa-phone"></i> 
                        <input type="tel" id="phone" placeholder="+1 (555) 000-0000" required> 
                    </div> 
                </div> 

                <div class="input-group"> 
                    <label for="password">Create Password</label> 
                    <div class="input-wrapper"> 
                        <i class="fas fa-lock"></i> 
                        <input type="password" id="password" placeholder="••••••••" required> 
                    </div> 
                </div> 

                <div class="form-footer"> 
                    <label class="remember-me"> 
                        <input type="checkbox" required> I agree to the <a href="#" class="forgot-pass">Terms</a>
                    </label> 
                </div> 

                <button type="submit" id="btn-register" class="btn-login">Create Account</button> 
                
                <p class="switch-form">Already have an account? <a href="login.html">Log In</a></p>
            </form> 
        </div> 
    </div> 
</div> 

<script src="login.js"></script>
</body>
</html>
